name: CI - RestaControl

on:
  push:
    branches:
      - practica-semana-13-ci
  pull_request:
    branches:
      - master

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar pruebas automatizadas
        run: npm test
