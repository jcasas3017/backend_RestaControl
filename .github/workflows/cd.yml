# ============================================================
#  Entrega Continua — RestaControl Backend
#  Build → Push GHCR → Deploy Render
# ============================================================
name: CD — Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/restacontrol-backend

jobs:
  # ── Job 1: Build & Push Docker Image ─────────────────────
  docker-build:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ── Job 2: Deploy to Render ──────────────────────────────
  deploy-cloud:
    name: 🚀 Deploy to Render
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK not configured — skipping deploy."
            exit 0
          fi
          echo "🚀 Triggering Render deploy…"
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo ""
          echo "✅ Deploy hook triggered successfully."
