spring.application.name=restacontrol
server.port=${PORT:8080}

# PostgreSQL — variables de entorno para CD, con defaults locales
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/restaurante}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep SQL schema management in PostgreSQL scripts
spring.sql.init.mode=never

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Actuator — health check para Render y pipelines
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
